<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F0F11">
<title>GMAT Focus Tracker</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }
  :root {
    --bg: #0F0F11;
    --surface: #1A1A1F;
    --card: #222228;
    --card-2: #2a2a32;
    --border: #2e2e36;
    --accent: #4F8EF7;
    --accent-soft: rgba(79, 142, 247, 0.16);
    --success: #3DDC84;
    --warning: #FFBB33;
    --danger: #FF5252;
    --text: #F1F1F3;
    --muted: #888899;
    --c-concept: #4F8EF7;
    --c-drill: #FF8C42;
    --c-review: #3DDC84;
    --c-mock: #FF5252;
    --c-slip: #888899;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
  }
  #app {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: 76px;
    position: relative;
  }
  .view {
    display: none;
    padding: 18px 16px 12px;
    animation: fadein 240ms ease-out;
  }
  .view.active { display: block; }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* === NAV === */
  #nav {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  #nav .nav-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 4px;
    min-height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    border-radius: 10px;
    transition: color 180ms, background 180ms;
    letter-spacing: 0.4px;
  }
  #nav .nav-btn .ico {
    font-size: 22px;
    line-height: 1;
  }
  #nav .nav-btn.active {
    color: var(--accent);
  }
  #nav .nav-btn:active {
    background: var(--card);
  }

  /* === COMMON === */
  h1, h2, h3, h4 {
    font-weight: 700;
    color: var(--text);
  }
  .muted { color: var(--muted); }
  .stack > * + * { margin-top: 12px; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .row.between { justify-content: space-between; }
  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge-type {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: #0F0F11;
  }
  .badge-type.CONCEPT { background: var(--c-concept); color: #fff; }
  .badge-type.DRILL   { background: var(--c-drill); color: #fff; }
  .badge-type.REVIEW  { background: var(--c-review); color: #0F0F11; }
  .badge-type.MOCK    { background: var(--c-mock); color: #fff; }
  .badge-type.SLIP, .badge-type.REST { background: var(--c-slip); color: #fff; }
  /* Day-editor tag chips: dim until picked, matching the day-editor's pick-any-tags UI */
  .day-editor .badge-type { opacity: 0.35; transition: opacity .12s; }
  .day-editor .badge-type.selected { opacity: 1; }
  .badge-type.EXAM    { background: var(--text); color: #0F0F11; }
  .topic-tag-badge {
    font-size: 9.5px;
    font-weight: 800;
    color: #0F0F11;
    padding: 2px 7px;
    border-radius: 6px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    flex-shrink: 0;
  }

  .btn {
    min-height: 48px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 160ms, border-color 160ms;
  }
  .btn:active { background: var(--card-2); }
  .btn.primary { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .btn.success { background: var(--success); color: #0F0F11; border-color: var(--success); }
  .btn.warning { background: var(--warning); color: #0F0F11; border-color: var(--warning); }
  .btn.muted   { background: var(--surface); color: var(--muted); }
  .btn.small   { min-height: 38px; padding: 6px 12px; font-size: 13px; }

  input[type="text"], input[type="number"], input[type="date"], textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    min-height: 44px;
  }
  textarea { min-height: 64px; resize: vertical; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  label { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; display: block; margin-bottom: 4px; }

  /* === WEEK VIEW === */
  .phase-bar {
    display: flex;
    gap: 2px;
    margin-bottom: 6px;
  }
  .phase-seg {
    flex: 1;
    height: 8px;
    border-radius: 2px;
    background: var(--border);
    transition: box-shadow 200ms;
  }
  .phase-seg.current {
    box-shadow: inset 0 0 0 2px #fff;
  }
  .phase-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.6px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .phase-labels span { font-weight: 700; }

  .week-header { margin-bottom: 14px; }
  .week-header .label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
  .week-header .range { font-size: 22px; font-weight: 800; margin-top: 2px; margin-bottom: 6px; line-height: 1.1; }

  .week-nav {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .week-nav .btn { flex: 1; }
  .week-nav .btn:disabled { opacity: 0.35; }

  .day-strip {
    display: flex;
    justify-content: space-between;
    gap: 4px;
    background: var(--surface);
    padding: 10px 8px;
    border-radius: 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .day-strip .day {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 2px;
    border-radius: 8px;
    cursor: pointer;
    min-height: 56px;
    justify-content: center;
  }
  .day-strip .day.today { background: rgba(255, 187, 51, 0.10); }
  .day-strip .day .lbl {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .day-strip .day.today .lbl { color: var(--warning); }
  .day-strip .day .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: transparent;
    border: 2px solid var(--border);
  }
  .day-strip .day.done .dot { background: var(--success); border-color: var(--success); }
  .day-strip .day.today:not(.done) .dot { background: var(--warning); border-color: var(--warning); }
  .day-strip .day .dnum { font-size: 9px; color: var(--muted); }

  .win-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    cursor: pointer;
  }
  .win-row.done { background: rgba(61, 220, 132, 0.10); border-color: var(--success); }
  .win-row .cbox {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 6px;
    border: 2px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }
  .win-row.done .cbox { background: var(--success); border-color: var(--success); }
  .win-row.done .cbox::after { content: "✓"; color: #0F0F11; font-weight: 900; font-size: 14px; }
  .win-row .txt { flex: 1; font-size: 13px; line-height: 1.4; }
  .win-row .txt .ttl { font-size: 10px; color: var(--warning); font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 3px; }

  .next-mock-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .next-mock-card .ttl { font-size: 10px; color: var(--c-mock); font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; }
  .next-mock-card input[type="text"] { width: 100%; background: var(--card-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 13px; margin-top: 4px; }

  .milestone {
    background: linear-gradient(135deg, rgba(255,187,51,.15), rgba(61,220,132,.15));
    border: 1px solid var(--warning);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.4;
  }

  .day-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    transition: opacity 200ms;
  }
  .day-card.done { opacity: 0.7; background: var(--surface); }
  .day-card .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .day-card .head .left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .day-card .head .left .daylbl {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .day-card .head .date {
    font-size: 11px;
    color: var(--muted);
  }
  .day-card.done .topic { text-decoration: line-through; color: var(--muted); }
  .day-card .topic { font-size: 15px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
  .day-card .meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    line-height: 1.4;
  }
  .day-card .meta strong { color: var(--text); font-weight: 600; }
  .day-card .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .day-card .actions .btn { flex: 1; min-width: 130px; }

  /* === MOCKS VIEW === */
  .section-title {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .sparkline-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .spark-tooltip {
    position: fixed;
    z-index: 9999;
    background: #1A1A1F;
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 11.5px;
    line-height: 1.4;
    pointer-events: none;
    display: none;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    max-width: 220px;
    white-space: normal;
  }
  .topic-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 10000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .topic-modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 16px 18px 22px;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.4);
  }
  @media (min-width: 520px) {
    .topic-modal-overlay { align-items: center; }
    .topic-modal { border-radius: 16px; }
  }
  .topic-modal-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 12px;
    position: sticky;
    top: 0;
    background: var(--card);
  }
  .topic-modal-title { font-size: 16px; font-weight: 800; }
  .topic-modal-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .topic-modal-close {
    background: var(--card-2);
    border: none;
    color: var(--text);
    border-radius: 8px;
    width: 28px;
    height: 28px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .topic-modal-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .topic-modal-list li {
    font-size: 13px;
    color: var(--text);
    background: var(--card-2);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .sparkline-card .stats {
    display: flex;
    justify-content: space-around;
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .sparkline-card .stats div { text-align: center; }
  .sparkline-card .stats .val {
    font-size: 16px;
    color: var(--text);
    font-weight: 700;
    display: block;
  }
  .sparkline svg { width: 100%; height: 90px; display: block; }

  .mock-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .mock-card .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    cursor: pointer;
    min-height: 56px;
  }
  .mock-card .cbox {
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 6px;
    border: 2px solid var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .mock-card.checked .cbox { background: var(--success); border-color: var(--success); }
  .mock-card.checked .cbox::after { content: "✓"; color: #0F0F11; font-weight: 900; font-size: 15px; }
  .mock-card .info { flex: 1; min-width: 0; }
  .mock-card .info .name { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .mock-card .info .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mock-card .status {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--muted);
    flex-shrink: 0;
  }
  .mock-card.checked .status { color: var(--success); }
  .mock-card .panel {
    display: none;
    padding: 14px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .mock-card.open .panel { display: block; }
  .attempt-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 12px;
  }
  .attempt-row .topl {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .attempt-row .scores {
    color: var(--muted);
    margin-bottom: 4px;
  }
  .attempt-row .scores strong { color: var(--text); }
  .attempt-row .mockname { font-weight: 700; color: var(--text); margin-top: 4px; font-size: 12.5px; }
  .attempt-row .date-line { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .attempt-row .notes { color: var(--muted); font-style: italic; }

  .score-form .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .score-form > * + * { margin-top: 10px; }

  .protocol-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-top: 18px;
    padding: 14px;
  }
  .protocol-section ul {
    list-style: none;
    padding: 0;
    margin-top: 8px;
  }
  .protocol-section li {
    font-size: 12px;
    color: var(--muted);
    padding: 4px 0;
    padding-left: 16px;
    position: relative;
  }
  .protocol-section li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  /* === TOPICS VIEW === */
  .topic-group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .topic-group .ghead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .topic-group > summary.ghead { cursor: pointer; list-style: none; }
  .topic-group > summary.ghead::-webkit-details-marker { display: none; }
  .topic-group > summary.ghead::marker { content: ''; }
  .topic-group > summary.ghead .gname::before {
    content: '▸';
    display: inline-block;
    margin-right: 6px;
    font-size: 11px;
    color: var(--muted);
    transition: transform 150ms;
  }
  .topic-group[open] > summary.ghead .gname::before { transform: rotate(90deg); }
  .topic-group .gname { font-size: 14px; font-weight: 700; }
  .topic-group .gstats { font-size: 11px; color: var(--muted); }
  .topic-group .gbar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .topic-group .gbar .fill {
    height: 100%;
    background: var(--success);
    transition: width 280ms ease;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    background: var(--card-2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
    transition: all 160ms;
  }
  .chip.in_progress {
    background: rgba(255, 187, 51, 0.18);
    color: var(--warning);
    border-color: var(--warning);
  }
  .chip.mastered {
    background: rgba(61, 220, 132, 0.18);
    color: var(--success);
    border-color: var(--success);
  }

  /* === CALENDAR VIEW === */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .cal-header .month-title { font-size: 18px; font-weight: 800; }
  .cal-header .navbtn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 14px;
  }
  .cal-wd {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 0;
  }
  .cal-cell {
    aspect-ratio: 1 / 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
    min-height: 52px;
  }
  .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .cal-cell.outside { opacity: 0.22; cursor: default; }
  .cal-cell.today { box-shadow: 0 0 0 2px var(--warning); }
  .cal-cell.selected { background: rgba(255, 187, 51, 0.16); box-shadow: 0 0 0 2px var(--warning); }
  .cal-cell .dnum { font-size: 13px; font-weight: 700; color: var(--text); }
  .cal-cell.outside .dnum { color: var(--muted); }
  .cal-cell .tdot-row {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
    max-width: 26px;
  }
  .cal-cell .tdot-mini {
    width: 8px;
    height: 8px;
    border-radius: 2px;
  }
  .mockdone-tick {
    position: absolute;
    bottom: 2px;
    right: 2px;
    font-size: 8px;
    font-weight: 900;
    color: var(--c-mock);
    line-height: 1;
  }
  .cal-cell.mockplanned {
    border-color: rgba(255, 82, 82, 0.35);
  }
  .mock-count-badge {
    position: absolute;
    top: 2px;
    right: 2px;
    background: var(--c-mock);
    color: #fff;
    font-size: 8px;
    font-weight: 900;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: flex;

## Appendix 2: Section Order Guide

**Recommended default:** Quant → DI → Verbal

| Section | Reasoning |
|---|---|
| Quant first | Mind is freshest. Quant breaks down fastest under fatigue. |
| DI second | Rewards working memory and pattern recognition while you're still sharp. |
| Verbal last | Reading carries you when tired. Verbal is the most fatigue-resistant section. |

**Alternative to test:** Quant → Verbal → DI (some find DI's working-memory load worse when tired).

Try **both orders during Phase 4** (Weeks 8–11). Lock your choice by December 13. **Do not change after Week 12.**

function load(key, dflt) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return dflt;
    return JSON.parse(raw);
  } catch (e) {
    console.warn('load failed for', key, e);
    return dflt;
  }
}
function save(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {
    console.warn('save failed for', key, e);
  }
}
function getState() {
  return {
    days:    load(STORE_KEYS.DAYS,    {}),
    wins:    load(STORE_KEYS.WINS,    {}),
    mocks:   load(STORE_KEYS.MOCKS,   null),
    topics:  load(STORE_KEYS.TOPICS,  {}),
    dayOverrides: load(STORE_KEYS.DAY_OVERRIDES, {})
  };
}

// Shared by the Week and Calendar tabs: maps dateISO -> { ids[], anyChecked }
// by scanning every logged attempt on every mock. Mocks carry no pre-set date,
// so this is the only source of truth for "was a mock taken on this day".
function buildMockByDate(mocks) {
  const byDate = {};
  for (const m of (mocks || [])) {
    for (const a of (m.attempts || [])) {
      if (!a.date) continue;
      const ds = a.date; // already "YYYY-MM-DD" from the <input type="date">
      if (!byDate[ds]) byDate[ds] = { ids: [], anyChecked: false };
      byDate[ds].ids.push(m.id);
      byDate[ds].anyChecked = true; // a logged attempt means it was taken that day
    }
  }
  return byDate;
}

// Colour lookup shared by the day-editor, the week/calendar day-content
// renderer, and the calendar grid dots. Keep in sync with the CSS
// custom properties (--c-concept etc.) and .badge-type.<TAG> classes.
function tagColorVar(tag) {
  if      (tag === 'CONCEPT') return 'var(--c-concept)';
  else if (tag === 'DRILL')   return 'var(--c-drill)';
  else if (tag === 'REVIEW')  return 'var(--c-review)';
  else if (tag === 'MOCK')    return 'var(--c-mock)';
  else if (tag === 'EXAM')    return 'var(--text)';
  else                        return 'var(--c-slip)'; // REST / unknown
}

// Migrates an older saved override (flat { tags:[], topics:[], notes }) into
// the current shape ({ topicTags: {key:TAG}, generalTags: [TAG...], notes }).
// Already-current overrides pass through unchanged. Returns null for no
// override, so callers can keep writing `if (override) ...`.
function normalizeOverride(raw) {
  if (!raw) return null;
  if (raw.topicTags || raw.generalTags) {
    return {
      topicTags: raw.topicTags || {},
      generalTags: raw.generalTags || [],
      notes: raw.notes || ''
    };
  }
  // Old shape: a flat list of day-level tags applied to every selected topic.
  const firstTag = (raw.tags && raw.tags[0]) || null;
  const topicTags = {};
  (raw.topics || []).forEach(k => { if (firstTag) topicTags[k] = firstTag; });
  return {
    topicTags,
    generalTags: (raw.topics && raw.topics.length) ? [] : (raw.tags || []),
    notes: raw.notes || ''
  };
}

// Shared by the Week and Calendar tabs: renders ONLY what the person has
// actually logged for a day — their chosen tags, chosen topics (grouped by
// their own individually-assigned tag), their notes, and any mock attempt
// logged that day. Never renders the original plan's prewritten
// topic/resource/task/stay-warm/time content.
function renderDayContentHTML(dateStr, mockInfo, mocksArr) {
  const overrides = load(STORE_KEYS.DAY_OVERRIDES, {});
  const override = normalizeOverride(overrides[dateStr]);
  let html = '';

  if (override) {
    const generalHTML = (override.generalTags || []).map(t =>
      `<span class="badge-type ${t}" style="margin:0 6px 6px 0;display:inline-block">${t}</span>`
    ).join('');
    if (generalHTML) html += `<div style="margin-top:2px">${generalHTML}</div>`;

    // Group topics by their own individually-assigned tag, each under its
    // own colored section — so a Concept topic and a Drill topic on the
    // same day show up separately, not lumped together.
    const byTag = {};
    Object.keys(override.topicTags || {}).forEach(key => {
      const tag = override.topicTags[key];
      if (!byTag[tag]) byTag[tag] = [];
      byTag[tag].push(key);
    });
    const tagOrder = ['CONCEPT', 'DRILL', 'REVIEW', 'MOCK', 'REST'];
    const groupsHTML = tagOrder
      .filter(tag => byTag[tag] && byTag[tag].length)
      .map(tag => {
        const items = byTag[tag].map(k =>
          `<li>${escapeHtml(k.split('::').pop())}</li>`
        ).join('');
        return `<div style="margin-top:10px">
          <div class="section-title" style="display:flex;align-items:center;gap:6px">
            <span style="width:9px;height:9px;border-radius:3px;display:inline-block;background:${tagColorVar(tag)}"></span>
            ${tag}
          </div>
          <ul style="margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--text)">${items}</ul>
        </div>`;
      }).join('');
    if (groupsHTML) html += groupsHTML;

    if (override.notes) {
      html += `<div class="section-title" style="margin-top:10px">Notes</div><div class="field">${escapeHtml(override.notes)}</div>`;
    }
  }

  if (mockInfo) {
    const rows = mockInfo.ids.map(id => {
      const mState  = (mocksArr || []).find(x => x.id === id);
      const hasScores = mState && (mState.attempts || []).some(a => a.scores && a.scores.total);
      const name    = mState ? mState.name : id;
      return `<div style="font-size:12px;color:${hasScores ? 'var(--success)' : 'var(--c-mock)'};margin-top:4px;font-weight:600">`
           + `${hasScores ? '✓' : '🎯'} ${escapeHtml(name)}</div>`;
    }).join('');
    html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">${rows}</div>`;
  } else {
    // No attempt logged for this day yet — but if this is the date scheduled
    // in the Next Mock widget, show it as "due" so it isn't invisible until
    // a score is actually logged.
    const nextMockPlan = load(STORE_KEYS.NEXT_MOCK, null);
    if (nextMockPlan && nextMockPlan.date === dateStr) {
      const timeLabel = nextMockPlan.time ? ' · ' + escapeHtml(nextMockPlan.time) : '';
      html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <div style="font-size:12px;color:var(--c-mock);opacity:0.75;margin-top:4px;font-weight:600">🎯 ${escapeHtml(nextMockPlan.name || 'Mock')} — due${timeLabel}</div>
      </div>`;
    }
  }

  if (!html) {
    html = `<div class="empty-state" style="padding:6px 0">Nothing logged for this day yet.</div>`;
  }
  return html;
}

// =====================================================================
// DATE HELPERS
// =====================================================================
function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function todayYMD() { return ymd(new Date()); }
function parseDateStr(str) {
  // "May 16" or "June 8" or "Jul 17" — year is auto-resolved via yearFor()
  // since the plan can span a calendar-year boundary.
  const parts = str.trim().split(/\s+/);
  const mo = MONTH_MAP[parts[0]];
  const da = parseInt(parts[1], 10);
  return new Date(yearFor(mo), mo, da);
}
function dayDiff(a, b) {
  // returns whole days between a and b, ignoring TZ drift
  const ms = b.getTime() - a.getTime();
  return Math.round(ms / 86400000);
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}
function fromYMD(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function fmtDay(d) {
  return ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
}
function fmtMonthName(d, short) {
  const names = short
    ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
    : ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return names[d.getMonth()];
}

// =====================================================================
// MARKDOWN PARSER
// =====================================================================
function parsePlan() {
  // Try cache
  const cached = load(STORE_KEYS.PLAN, null);
  if (cached && cached.version === PLAN_VERSION && cached.weeks && cached.weeks.length === 19) {
    return cached;
  }

  const lines = PLAN_MARKDOWN.split('\n');
  const weeks = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];

    // Week header: "## Week 1 (May 16 – May 22) — ..."
    const wkMatch = line.match(/^##\s+Week\s+(\d+)\s+\(([^)]+)\)/);
    if (wkMatch) {
      const weekNum = parseInt(wkMatch[1], 10);
      const dateRange = wkMatch[2].trim(); // "May 16 – May 22"
      const week = parseWeekBlock(lines, i, weekNum, dateRange);
      weeks.push(week);
      i = week._nextIdx;
      continue;
    }

    // Diagnostic day standalone — "# DIAGNOSTIC DAY: May 30 (Saturday)"
    const diagMatch = line.match(/^#\s+DIAGNOSTIC DAY:\s+([A-Z][a-z]+\s+\d+)/);
    if (diagMatch) {
      // Attach this day(s) to the previous week (Week 2) as additional entries
      const prevWeek = weeks[weeks.length - 1];
      if (prevWeek) {
        const diagDays = parseStandaloneDays(lines, i);
        for (const d of diagDays) {
          prevWeek.days.push(d);
        }
        // Extend prevWeek endDate if needed
        const lastDate = diagDays.map(d => fromYMD(d.date)).sort((a,b)=>b-a)[0];
        if (lastDate && ymd(lastDate) > prevWeek.endDate) {
          prevWeek.endDate = ymd(lastDate);
        }
      }
      // Advance past this diagnostic block to the next ## Week or # PHASE header
      let j = i + 1;
      while (j < lines.length && !lines[j].match(/^##\s+Week\s+\d+/) && !lines[j].match(/^#\s+PHASE/)) {
        j++;
      }
      i = j;
      continue;
    }
    i++;
  }

  const parsed = {
    version: PLAN_VERSION,
    weeks: weeks
  };
  save(STORE_KEYS.PLAN, parsed);
  return parsed;
}

function parseStandaloneDays(lines, startIdx) {
  // Parse all day entries between this header and the next ## Week / # PHASE header
  const days = [];
  let i = startIdx + 1;
  while (i < lines.length) {
    if (lines[i].match(/^##\s+Week\s+\d+/)) break;
    if (lines[i].match(/^#\s+PHASE/)) break;
    const dayMatch = lines[i].match(/^###\s+(MON|TUE|WED|THU|FRI|SAT|SUN)\s+([A-Z][a-z]+\s+\d+)\s+—\s+(.+)$/);
    if (dayMatch) {
      const d = parseDayBlock(lines, i, dayMatch);
      days.push(d.day);
      i = d.nextIdx;
      continue;
    }
    i++;
  }
  return days;
}

function parseWeekBlock(lines, startIdx, weekNum, dateRange) {
  // dateRange e.g. "May 16 – May 22"
  // Find startDate and endDate
  const rangeParts = dateRange.split(/\s*[–-]\s*/);
  let startDateStr = rangeParts[0]; // "May 16"
  let endDateStr = rangeParts[1];    // "May 22"
  // If endDate is just a number (e.g. "May 16 – 22"), we'd handle it; spec has full "May 22"
  // But for cross-month ranges like "July 27 – August 2", parsing is straightforward.

  const startDate = parseDateStr(startDateStr);
  let endDate;
  if (/^\d+$/.test(endDateStr.trim())) {
    // bare day → same month AND same resolved year as start (never crosses a year boundary)
    endDate = new Date(startDate.getFullYear(), startDate.getMonth(), parseInt(endDateStr.trim(), 10));
  } else {
    endDate = parseDateStr(endDateStr);
  }

  const days = [];
  let i = startIdx + 1;
  while (i < lines.length) {
    // Stop at next week or phase header
    if (lines[i].match(/^##\s+Week\s+\d+/)) break;
    if (lines[i].match(/^#\s+PHASE/)) break;
    if (lines[i].match(/^#\s+DIAGNOSTIC DAY/)) break;
    if (lines[i].match(/^#\s+APPENDICES/)) break;

    // Day header: "### MON May 18 — CONCEPT (Quant)"
    const dayMatch = lines[i].match(/^###\s+(MON|TUE|WED|THU|FRI|SAT|SUN)\s+([A-Z][a-z]+\s+\d+)\s+—\s+(.+)$/);
    if (dayMatch) {
      const d = parseDayBlock(lines, i, dayMatch);
      days.push(d.day);
      i = d.nextIdx;
      continue;
    }
    i++;
  }

  return {
    weekNum,
    dateRange,
    startDate: ymd(startDate),
    endDate: ymd(endDate),
    phase: PHASE_OF_WEEK[weekNum] || '',
    winCondition: WIN_CONDITIONS[weekNum] || '',
    days,
    _nextIdx: i
  };
}

function parseDayBlock(lines, startIdx, dayMatch) {
  const label = dayMatch[1];          // "MON"
  const dateText = dayMatch[2];       // "May 18"
  const titleRest = dayMatch[3];      // "CONCEPT (Quant)" or "MOCK (Diagnostic)" etc.

  const dateObj = parseDateStr(dateText);
  const dateISO = ymd(dateObj);

  // Determine day type by scanning the titleRest
  const titleUpper = titleRest.toUpperCase();
  let type = 'CONCEPT';
  if      (titleUpper.includes('EXAM'))    type = 'EXAM';
  else if (titleUpper.includes('MOCK'))    type = 'MOCK';
  else if (titleUpper.includes('DRILL'))   type = 'DRILL';
  else if (titleUpper.includes('SLIP'))    type = 'SLIP';
  else if (titleUpper.includes('REST'))    type = 'SLIP';
  else if (titleUpper.includes('TAPER'))   type = 'REVIEW';
  else if (titleUpper.includes('REVIEW'))  type = 'REVIEW';
  else if (titleUpper.includes('PLANNING')) type = 'REVIEW';
  else if (titleUpper.includes('LIGHT'))   type = 'REVIEW';
  else if (titleUpper.includes('DRESS'))   type = 'MOCK';
  else if (titleUpper.includes('CONCEPT')) type = 'CONCEPT';

  let topic = '', resource = '', task = '', time = '', staywarm = '';

  let i = startIdx + 1;
  while (i < lines.length) {
    const l = lines[i];
    if (l.match(/^###\s+(MON|TUE|WED|THU|FRI|SAT|SUN)\s+/)) break;
    if (l.match(/^##\s+Week\s+\d+/)) break;
    if (l.match(/^#\s+PHASE/)) break;
    if (l.match(/^#\s+DIAGNOSTIC DAY/)) break;
    if (l.match(/^#\s+APPENDICES/)) break;

    // Match bullet fields: - **Topic:** value
    const fieldMatch = l.match(/^-\s+\*\*([^*]+):\*\*\s*(.*)$/);
    if (fieldMatch) {
      const key = fieldMatch[1].trim().toLowerCase();
      const val = fieldMatch[2].trim();
      if (key === 'topic')                     topic = val;
      else if (key === 'resource' || key === 'resources') resource = val;
      else if (key === 'task' || key === 'mock' || key === 'conditions') {
        // The MOCK day uses "Mock:" instead of "Topic:" sometimes
        if (key === 'mock' && !topic) topic = val;
        else if (key === 'conditions' && !resource) resource = val;
        else task = task ? task + ' ' + val : val;
      }
      else if (key === 'time')                 time = val;
      else if (key === 'stay-warm')            staywarm = val;
    }
    // Also handle non-bullet bold fields (exam day uses **Wake time:** etc.)
    const boldMatch = l.match(/^\*\*([^*]+):\*\*\s*(.+)$/);
    if (boldMatch && !fieldMatch) {
      const key = boldMatch[1].trim().toLowerCase();
      const val = boldMatch[2].trim();
      if (!topic && (key === 'wake time' || key === 'breakfast' || key === 'travel' || key === 'at the test center' || key === 'during the exam')) {
        // For exam day, build a simple topic and stitch the rest into task
        if (!topic) topic = 'GMAT FOCUS EDITION — EXAM DAY';
        task = task ? task + ' • ' + key.charAt(0).toUpperCase() + key.slice(1) + ': ' + val
                    : key.charAt(0).toUpperCase() + key.slice(1) + ': ' + val;
      }
    }
    i++;
  }

  if (!topic) topic = titleRest;

  return {
    nextIdx: i,
    day: { label, type, topic, resource, task, time, staywarm, date: dateISO, title: titleRest }
  };
}

function nextMockDefaultName() {

// The custom "mock name" (e.g. "Official Mock 3") belongs to the mock as a

// =====================================================================

// =====================================================================
function getCurrentWeek() {
  const today = todayYMD();
  for (const w of PLAN.weeks) {
    if (today >= w.startDate && today <= w.endDate) return w.weekNum;
  }
  // Before plan?
  if (today < PLAN.weeks[0].startDate) return 1;
  // After plan
  return 19;
}

// =====================================================================
// UTILITY
// =====================================================================
function escapeHtml(s) {
  if (s === undefined || s === null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── Score Trend sparkline: 4 switchable metrics (Overall/Quant/Verbal/DI),
// selected via tabs or a left/right swipe on the chart.
const SPARK_METRICS = [
  { key: 'total',  label: 'Overall' },
  { key: 'quant',  label: 'Quant' },
  { key: 'verbal', label: 'Verbal' },
  { key: 'di',     label: 'DI' }
];
let sparkMetricIndex = 0;
let sparkTouchStartX = null;
function setSparkMetric(i) {
  if (i < 0) i = SPARK_METRICS.length - 1;
  if (i >= SPARK_METRICS.length) i = 0;
  sparkMetricIndex = i;
  renderMocks();
}
function sparkTouchStart(evt) {
  sparkTouchStartX = (evt.touches && evt.touches[0]) ? evt.touches[0].clientX : null;
}
function sparkTouchEnd(evt) {
  if (sparkTouchStartX === null) return;
  const t = evt.changedTouches && evt.changedTouches[0];
  const endX = t ? t.clientX : null;
  const startX = sparkTouchStartX;
  sparkTouchStartX = null;
  if (endX === null) return;
  const dx = endX - startX;
  if (Math.abs(dx) < 30) return; // ignore small/accidental movements
  if (dx < 0) setSparkMetric(sparkMetricIndex + 1); // swipe left -> next section
  else setSparkMetric(sparkMetricIndex - 1);        // swipe right -> previous section
}

// ── Score Trend sparkline tooltip: works on both hover (desktop) and
// tap (touch/mobile), since native SVG <title> tooltips don't show
// reliably on touch devices or in embedded webviews.
let sparkTooltipPinned = false;
function ensureSparkTooltipEl() {
  let el = document.getElementById('spark-tooltip');
  if (!el && document.body) {
    el = document.createElement('div');
    el.id = 'spark-tooltip';
    el.className = 'spark-tooltip';
    document.body.appendChild(el);
  }
  return el;
}
function positionSparkTooltip(evt) {
  const el = document.getElementById('spark-tooltip');
  if (!el || el.style.display !== 'block' || !evt) return;
  el.style.left = (evt.clientX + 12) + 'px';
  el.style.top  = (evt.clientY - 12) + 'px';
}
function showSparkTooltip(evt, html) {
  const el = ensureSparkTooltipEl();
  if (!el) return;
  el.innerHTML = html;
  el.style.display = 'block';
  positionSparkTooltip(evt);
}
function hideSparkTooltip() {
  const el = document.getElementById('spark-tooltip');
  if (el) el.style.display = 'none';
}
function toggleSparkTooltip(evt, html) {
  const el = ensureSparkTooltipEl();
  if (!el) return;
  if (sparkTooltipPinned && el.style.display === 'block') {
    hideSparkTooltip();
    sparkTooltipPinned = false;
  } else {
    showSparkTooltip(evt, html);
    sparkTooltipPinned = true;
  }
}
if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('click', function () {
    if (sparkTooltipPinned) { hideSparkTooltip(); sparkTooltipPinned = false; }
  });
}

function daysUntilExam() {
  const today = new Date();
  today.setHours(0,0,0,0);
  const exam = fromYMD(EXAM_DATE);
  return Math.max(0, dayDiff(today, exam));
}

function burstConfetti() {
  const root = document.getElementById('confetti');
  const colors = ['#4F8EF7','#3DDC84','#FFBB33','#FF5252','#FF8C42','#F1F1F3'];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.background = colors[i % colors.length];
    const angle = Math.random() * Math.PI * 2;
    const dist = 90 + Math.random() * 160;
    p.style.setProperty('--dx', (Math.cos(angle) * dist) + 'px');
    p.style.setProperty('--dy', (Math.sin(angle) * dist) + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    root.appendChild(p);
    setTimeout(() => p.remove(), 900);
  }
}

  renderWeek();
}
function clearNextMockPlan() {
  save(STORE_KEYS.NEXT_MOCK, null);
  editingNextMock = false;
  renderWeek();
}

function renderWeek() {
  const root = document.getElementById('view-week');
  const state = getState();
  const week = PLAN.weeks.find(w => w.weekNum === viewedWeek) || PLAN.weeks[0];

  const mockByDate = buildMockByDate(state.mocks);

  // Phase progress bar
  let phaseBarHTML = '<div class="phase-bar">';
  for (let i = 1; i <= 19; i++) {
    const ph = PHASE_OF_WEEK[i];
    const color = i <= getCurrentWeek() ? PHASE_COLOR[ph] : 'var(--border)';
    const isCur = (i === week.weekNum) ? ' current' : '';
    phaseBarHTML += `<div class="phase-seg${isCur}" style="background:${color}"></div>`;
  }
  phaseBarHTML += '</div>';

  // Day strip — show all days of this week
  const today = todayYMD();
  let stripHTML = '<div class="day-strip">';
  for (const d of week.days) {
    const isToday = d.date === today;
    const isDone = !!state.days[d.date];
    stripHTML += `
      <div class="day${isToday ? ' today' : ''}${isDone ? ' done' : ''}" data-date="${d.date}" onclick="scrollToDayCard('${d.date}')">
        <span class="lbl">${d.label}</span>
        <span class="dot"></span>
        <span class="dnum">${parseInt(d.date.split('-')[2],10)}</span>
      </div>
    `;
  }
  stripHTML += '</div>';

  // Day cards — show ONLY what's been logged for each day (tags/topics/notes/mock),
  // never the plan's original prewritten topic/resource/task/stay-warm/time.
  const overrides = state.dayOverrides;
  let dayCardsHTML = '';
  for (const d of week.days) {
    const isDone = !!state.days[d.date];
    const dateObj = fromYMD(d.date);
    const dateLbl = fmtMonthName(dateObj, true) + ' ' + parseInt(d.date.split('-')[2],10);
    const override = overrides[d.date];
    const mockInfo = mockByDate[d.date];
    dayCardsHTML += `
      <div class="day-card${isDone ? ' done' : ''}" id="card-${d.date}">
        <div class="head">
          <div class="left">
            <span class="daylbl">${d.label}</span>
          </div>
          <span class="date">${dateLbl}</span>
        </div>
        ${renderDayContentHTML(d.date, mockInfo, state.mocks)}
        <div class="actions">
          <button class="btn primary" onclick="editDayFromWeek('${d.date}')">${override ? 'Edit' : '+ Add schedule'}</button>
        </div>
      </div>
    `;
  }

  root.innerHTML = `
    <div class="top-strip">
      <div class="brand"><b>GMAT</b> · Focus Tracker</div>
      <div class="exam-cd">${daysUntilExam()}d to exam</div>
    </div>
    ${phaseBarHTML}
    <div class="phase-labels">
      <span style="color:${PHASE_COLOR.Foundation}">Foundation</span>
      <span style="color:${PHASE_COLOR.Drilling}">Drilling</span>
      <span style="color:${PHASE_COLOR.Integration}">Integration</span>
      <span style="color:${PHASE_COLOR.Peak}">Peak</span>
    </div>

    <div class="week-header">
      <div class="label">WEEK ${week.weekNum} OF 19</div>
      <div class="range">${escapeHtml(week.dateRange)}</div>
      <span class="pill" style="background:${PHASE_COLOR[week.phase]}40; color:${PHASE_COLOR[week.phase]}; border:1px solid ${PHASE_COLOR[week.phase]}">${escapeHtml(week.phase)}</span>
    </div>

    <div class="week-nav">
      <button class="btn small" onclick="changeWeek(-1)" ${week.weekNum === 1 ? 'disabled' : ''}>← Prev</button>
      <button class="btn small" onclick="goCurrentWeek()">This week</button>
      <button class="btn small" onclick="changeWeek(1)" ${week.weekNum === 19 ? 'disabled' : ''}>Next →</button>
    </div>

    ${stripHTML}

    ${renderNextMockWidgetHTML()}

    <div class="section-title">Days</div>
    ${dayCardsHTML}
  `;
}

function changeWeek(delta) {
  const newWk = viewedWeek + delta;
  if (newWk < 1 || newWk > 19) return;
  viewedWeek = newWk;
  renderWeek();
}
function goCurrentWeek() {
  viewedWeek = getCurrentWeek();
  renderWeek();
}
function scrollToDayCard(dateStr) {
  const el = document.getElementById('card-' + dateStr);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function toggleDay(dateStr) {
  const days = load(STORE_KEYS.DAYS, {});
  const wasDone = !!days[dateStr];
  if (wasDone) {
    delete days[dateStr];
  } else {
    days[dateStr] = true;
  }
  save(STORE_KEYS.DAYS, days);
  if (!wasDone) burstConfetti();
  renderWeek();
  renderCalendar();
}
function toggleWin(weekNum) {
  const wins = load(STORE_KEYS.WINS, {});
  const wasWon = !!wins[weekNum];
  if (wasWon) {
    delete wins[weekNum];
  } else {
    wins[weekNum] = true;
  }
  save(STORE_KEYS.WINS, wins);
  if (!wasWon) burstConfetti();
  renderWeek();
}

function renderMocks() {
  const root = document.getElementById('view-mocks');
  const ordered = load(STORE_KEYS.MOCKS, []);

  // Sparkline — one metric shown at a time (Overall/Quant/Verbal/DI), switched
  // via tabs or a left/right swipe on the chart itself.
  const activeMetric = SPARK_METRICS[sparkMetricIndex] || SPARK_METRICS[0];
  const allAttempts = [];
  for (const m of ordered) {
    (m.attempts || []).forEach((a, idx) => {
      const value = parseInt(a.scores && a.scores[activeMetric.key], 10);
      if (value) {
        allAttempts.push({
          mock: m.name,
          mockName: getMockDisplayName(m),
          value,
          date: a.date || '',
          attemptNum: a.attemptNum || (idx + 1),
          isRetake: (a.attemptNum || (idx + 1)) > 1
        });
      }
    });
  }
  // Sort by date (mocks no longer carry a pre-set schedule, so date is all we have)
  allAttempts.sort((a, b) => {
    if (a.date && b.date && a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.date && !b.date) return -1;
    if (!a.date && b.date) return 1;
    return a.attemptNum - b.attemptNum;
  });

  const tabsHTML = SPARK_METRICS.map((m, i) => {
    const sel = i === sparkMetricIndex;
    return `<button type="button" onclick="setSparkMetric(${i})" style="flex:1;padding:6px 0;border-radius:8px;border:none;cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:${sel ? 'var(--warning)' : 'transparent'};color:${sel ? '#0F0F11' : 'var(--muted)'}">${m.label}</button>`;
  }).join('');
  const tabsRowHTML = `<div style="display:flex;gap:4px;background:var(--card-2);border-radius:10px;padding:3px;margin-bottom:10px">${tabsHTML}</div>`;
  const swipeHandlers = `ontouchstart="sparkTouchStart(event)" ontouchend="sparkTouchEnd(event)"`;

  let sparkHTML = '';
  if (allAttempts.length >= 2) {
    const values = allAttempts.map(a => a.value);
    const minT = Math.min(...values);
    const maxT = Math.max(...values);
    const range = Math.max(maxT - minT, 50);
    const W = 380, H = 90, padX = 20, padY = 14;
    const stepX = (W - 2*padX) / (allAttempts.length - 1 || 1);
    let pathD = '';
    let dots = '';
    // Pre-built tooltip HTML per dot, looked up by index at hover/tap time —
    // keeps the inline event-handler attributes simple (no HTML-in-attribute
    // escaping headaches) while still showing full detail: which mock, which
    // attempt/retake, the score, and the date. Rebuilt for whichever metric
    // is currently active, so hover/tap detail works on every section.
    window.__sparkTips = allAttempts.map(a => {
      const attemptLabel = `${escapeHtml(a.mock)}${a.isRetake ? ' — Retake ' + a.attemptNum : ' — Attempt 1'}`;
      // Lead with the custom mock name when one's been set (e.g. "Official
      // Mock 3") since that's what the person actually recognizes it by;
      // the generic Mock N / attempt label becomes a smaller subtitle. Falls
      // back to the old single-line look when no custom name is set.
      const titleLine = a.mockName ? escapeHtml(a.mockName) : attemptLabel;
      const subLine = a.mockName ? `<div style="color:var(--muted);font-size:10.5px;margin-top:1px">${attemptLabel}</div>` : '';
      const dateLine = a.date ? `<div style="color:var(--muted);font-size:10.5px;margin-top:2px">${escapeHtml(a.date)}</div>` : '';
      return `<div style="font-weight:800;margin-bottom:2px">${titleLine}</div>${subLine}<div>${escapeHtml(activeMetric.label)}: ${escapeHtml(String(a.value))}</div>${dateLine}`;
    });
    allAttempts.forEach((a, i) => {
      const x = padX + i * stepX;
      const yNorm = (a.value - minT) / range;
      const y = H - padY - yNorm * (H - 2*padY);
      pathD += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
      const color = a.isRetake ? '#FFBB33' : '#4F8EF7';
      const handlers = `onmouseenter="showSparkTooltip(event, window.__sparkTips[${i}])" onmousemove="positionSparkTooltip(event)" onmouseleave="hideSparkTooltip()" onclick="event.stopPropagation(); toggleSparkTooltip(event, window.__sparkTips[${i}])"`;
      // A larger invisible circle first (bigger tap target for touch), then
      // the visible dot on top — both carry the same handlers.
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="transparent" style="cursor:pointer" ${handlers}></circle>`;
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${color}" stroke="#1A1A1F" stroke-width="2" style="cursor:pointer" ${handlers}></circle>`;
    });
    sparkHTML = `
      <div class="sparkline-card">
        <div class="section-title" style="margin-bottom:6px">Score Trend — ${escapeHtml(activeMetric.label)}</div>
        ${tabsRowHTML}
        <div class="sparkline" ${swipeHandlers}>
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
            <path d="${pathD}" fill="none" stroke="#4F8EF7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            ${dots}
          </svg>
        </div>
        <div class="stats">
          <div><span class="val">${minT}</span>Min</div>
          <div><span class="val">${maxT}</span>Max</div>
          <div><span class="val">${allAttempts.length}</span>Logged</div>
        </div>
        <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:6px">
          <span style="color:#4F8EF7">●</span> First take &nbsp; <span style="color:#FFBB33">●</span> Retake
        </div>
        <div style="font-size:9.5px;color:var(--muted);text-align:center;margin-top:4px">Swipe or tap a tab to switch sections</div>
      </div>
    `;
  } else {
    sparkHTML = `
      <div class="sparkline-card">
        <div class="section-title" style="margin-bottom:6px">Score Trend — ${escapeHtml(activeMetric.label)}</div>
        ${tabsRowHTML}
        <div class="empty-state" ${swipeHandlers}>Log 2+ ${escapeHtml(activeMetric.label)} scores to see this trend</div>
      </div>
    `;
  }

  // Mock cards — flat list, no section headers, no pre-set dates
  let cardsHTML = '';

  // Summary bar counts
  const totalMocks = ordered.length;
  const takenMocks = ordered.filter(m => (m.attempts || []).some(a => a.scores && a.scores.total)).length;
  cardsHTML += `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;">
      <div><span style="font-size:22px;font-weight:800;color:var(--text)">${totalMocks}</span><div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-top:2px">TOTAL</div></div>
      <div style="width:1px;background:var(--border)"></div>
      <div><span style="font-size:22px;font-weight:800;color:var(--success)">${takenMocks}</span><div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-top:2px">TAKEN</div></div>
      <div style="width:1px;background:var(--border)"></div>
      <div><span style="font-size:22px;font-weight:800;color:var(--warning)">${totalMocks - takenMocks}</span><div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-top:2px">REMAINING</div></div>
    </div>
  `;

  // Add Mock control — no native prompt(), just an inline text field + button
  cardsHTML += `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:8px;align-items:center">
      <input type="text" id="new-mock-name" placeholder="${escapeHtml(nextMockDefaultName())}" style="flex:1;background:var(--card-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px" onkeydown="if(event.key==='Enter'){addMock(this.value);}">
      <button class="btn primary small" onclick="addMock(document.getElementById('new-mock-name').value)">+ Add Mock</button>
    </div>
  `;

  for (const m of ordered) {
    const hasScores = (m.attempts || []).some(a => a.scores && a.scores.total);
    const checked = hasScores;
    const status = hasScores ? 'Scores logged' : 'Not taken';
    const attempts = m.attempts || [];
    const attemptDates = attempts.map(a => a.date).filter(Boolean);
    const subLine = attemptDates.length
      ? (attemptDates.length === 1 ? attemptDates[0] : attemptDates.length + ' attempts logged')
      : 'No attempts logged yet';

    // The custom mock name belongs to the mock itself, so it's the same
    // across every attempt/retake of it — entered once, shown on every row.
    const mockDisplayName = getMockDisplayName(m);

    // Attempts rendering
    let attemptsHTML = '';
    if (attempts.length > 0) {
      attemptsHTML = attempts.map(a => {
        const s = a.scores || {};
        const deleteKey = m.id + '-' + a.attemptNum;
        const confirming = pendingDeleteAttempt === deleteKey;
        const isEditing = editingAttemptKey === deleteKey;

        if (isEditing) {
          return renderAttemptEditFormHTML(m, a);
        }

        const controlsHTML = confirming
          ? `<div style="margin-top:6px;display:flex;gap:8px;align-items:center">
               <span style="font-size:12px;color:var(--danger,#FF5252);font-weight:600">Delete this attempt?</span>
               <button class="btn small" style="background:var(--danger,#FF5252);color:#fff" onclick="deleteAttempt('${m.id}', ${a.attemptNum})">Yes, delete</button>
               <button class="btn small muted" onclick="cancelDeleteAttempt()">Cancel</button>
             </div>`
          : `<div style="margin-top:6px;display:flex;gap:8px">
               <button class="btn small muted" onclick="startEditAttempt('${m.id}', ${a.attemptNum})">Edit</button>
               <button class="btn small muted" onclick="requestDeleteAttempt('${m.id}', ${a.attemptNum})">Delete</button>
             </div>`;
        return `
          <div class="attempt-row">
            <div class="topl">
              <span>Attempt ${a.attemptNum}</span>
            </div>
            <div class="scores">
              <strong>Total:</strong> ${escapeHtml(s.total || '—')} ·
              <strong>Q:</strong> ${escapeHtml(s.quant || '—')} ·
              <strong>V:</strong> ${escapeHtml(s.verbal || '—')} ·
              <strong>DI:</strong> ${escapeHtml(s.di || '—')}
            </div>
            ${mockDisplayName ? `<div class="mockname">${escapeHtml(mockDisplayName)}</div>` : ''}
            <div class="date-line">${escapeHtml(a.date || '')}</div>
            ${a.notes ? `<div class="notes">${escapeHtml(a.notes)}</div>` : ''}
            ${controlsHTML}
          </div>
        `;
      }).join('');
    }

    // Score entry form — always available, so every mock can be retaken as many times as needed
    const nextAttemptNum = attempts.length + 1;
    const formHTML = `
        <div class="score-form">
          <div class="section-title" style="font-size:10px;margin-bottom:8px">${nextAttemptNum === 1 ? 'Log Score' : 'Log Retake — Attempt ' + nextAttemptNum}</div>
          <div>
            <label>Mock name (optional — set once, carries over to retakes)</label>
            <input type="text" id="mockname-${m.id}" placeholder="e.g. Official Mock 3" value="${escapeHtml(mockDisplayName)}">
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="date-${m.id}-${nextAttemptNum}" value="${todayYMD()}">
          </div>
          <div class="grid2">
            <div>
              <label>Total (205–805)</label>
              <input type="number" id="total-${m.id}-${nextAttemptNum}" placeholder="e.g. 705" min="205" max="805">
            </div>
            <div>
              <label>Quant (60–90)</label>
              <input type="number" id="quant-${m.id}-${nextAttemptNum}" placeholder="e.g. 85" min="60" max="90">
            </div>
            <div>
              <label>Verbal (60–90)</label>
              <input type="number" id="verbal-${m.id}-${nextAttemptNum}" placeholder="e.g. 84" min="60" max="90">
            </div>
            <div>
              <label>DI (60–90)</label>
              <input type="number" id="di-${m.id}-${nextAttemptNum}" placeholder="e.g. 82" min="60" max="90">
            </div>
          </div>
          <div>
            <label>Notes (Concept / Careless / Timing)</label>
            <textarea id="notes-${m.id}-${nextAttemptNum}" placeholder="What broke under fatigue?"></textarea>
          </div>
          <div>
            <button class="btn primary" onclick="saveAttempt('${m.id}', ${nextAttemptNum})">${nextAttemptNum === 1 ? 'Save Score' : 'Save Retake'}</button>
          </div>
        </div>
      `;

    const deletingMock = pendingDeleteMock === m.id;
    const deleteMockControlHTML = deletingMock
      ? `<div style="padding:10px 14px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--border)">
           <span style="font-size:12px;color:var(--danger,#FF5252);font-weight:600">Delete "${escapeHtml(m.name)}" and all its logged attempts?</span>
           <button class="btn small" style="background:var(--danger,#FF5252);color:#fff" onclick="event.stopPropagation(); deleteMock('${m.id}')">Yes, delete</button>
           <button class="btn small muted" onclick="event.stopPropagation(); cancelDeleteMock()">Cancel</button>
         </div>`
      : '';

    cardsHTML += `
      <div class="mock-card${checked ? ' checked' : ''}${openMockCards.has(m.id) ? ' open' : ''}" id="mock-${m.id}">
        <div class="head">
          <div class="cbox" onclick="toggleMockPanel('${m.id}')" title="${hasScores ? 'Scores logged' : 'Not taken yet — log a score below'}"></div>
          <div class="info" onclick="toggleMockPanel('${m.id}')">
            <div class="name">${escapeHtml(m.name)}</div>
            <div class="sub">${escapeHtml(subLine)}</div>
          </div>
          <div class="status">${status}</div>
          <button class="btn small muted" style="margin-left:8px" onclick="event.stopPropagation(); requestDeleteMock('${m.id}')" title="Delete mock">🗑</button>
        </div>
        ${deleteMockControlHTML}
        <div class="panel">
          ${attemptsHTML}
          ${formHTML}
        </div>
      </div>
    `;
  }

  root.innerHTML = `
    <div class="top-strip">
      <div class="brand"><b>MOCKS</b> · ${totalMocks} total</div>
      <div class="exam-cd">${daysUntilExam()}d to exam</div>
    </div>
    ${sparkHTML}
    ${cardsHTML}
    <div class="protocol-section">
      <div class="section-title" style="margin-bottom:0">Mock Protocol</div>
      <ul>
        <li>No pausing — full 2h15m + optional 10-min break</li>
        <li>Review every wrong answer same day</li>
        <li>Classify error: concept / careless / timing</li>
        <li>Spend equal time reviewing as taking</li>
        <li>Update error log after every mock</li>
        <li>Once you're deep into mock season, run each one at your planned real exam start time</li>
      </ul>
    </div>
  `;
}

function toggleMockPanel(id) {
  if (openMockCards.has(id)) openMockCards.delete(id);
  else openMockCards.add(id);
  const el = document.getElementById('mock-' + id);
  if (el) el.classList.toggle('open');
}
function saveAttempt(id, attemptNum) {
  const mocks = load(STORE_KEYS.MOCKS, []);
  const m = mocks.find(x => x.id === id);
  if (!m) return;
  // Mock name is stored once on the mock itself — same field, whether this
  // is the first attempt or a retake, so it's never re-typed.
  const mockNameEl = document.getElementById('mockname-' + id);
  if (mockNameEl) m.mockName = mockNameEl.value.trim();
  const date  = document.getElementById('date-'  + id + '-' + attemptNum).value;
  const total = document.getElementById('total-' + id + '-' + attemptNum).value;
  const quant = document.getElementById('quant-' + id + '-' + attemptNum).value;
  const verbal= document.getElementById('verbal-'+ id + '-' + attemptNum).value;
  const di    = document.getElementById('di-'    + id + '-' + attemptNum).value;
  const notes = document.getElementById('notes-' + id + '-' + attemptNum).value;
  if (!m.attempts) m.attempts = [];
  m.attempts.push({
    attemptNum,
    date,
    scores: { total, quant, verbal, di },
    notes
  });
  m.checked = true;
  save(STORE_KEYS.MOCKS, mocks);
  renderMocks();
  renderCalendar();
}
function requestDeleteAttempt(id, attemptNum) {
  pendingDeleteAttempt = id + '-' + attemptNum;
  renderMocks();
}
function cancelDeleteAttempt() {
  pendingDeleteAttempt = null;
  renderMocks();
}
function deleteAttempt(id, attemptNum) {
  // No native confirm() here by design — some embedded/webview contexts silently
  // block or no-op window.confirm(), which made this button appear broken.
  // Confirmation now happens inline via requestDeleteAttempt/cancelDeleteAttempt.
  const mocks = load(STORE_KEYS.MOCKS, []);
  const m = mocks.find(x => x.id === id);
  if (!m) return;
  m.attempts = (m.attempts || []).filter(a => a.attemptNum !== attemptNum);
  // Renumber remaining attempts
  m.attempts.forEach((a, i) => a.attemptNum = i + 1);
  if (m.attempts.length === 0) m.checked = false;
  save(STORE_KEYS.MOCKS, mocks);
  pendingDeleteAttempt = null;
  renderMocks();
  renderCalendar();
}

function startEditAttempt(id, attemptNum) {
  editingAttemptKey = id + '-' + attemptNum;
  pendingDeleteAttempt = null; // don't show a delete-confirm and an edit form at once
  openMockCards.add(id); // keep the card expanded while editing
  renderMocks();
}
function cancelEditAttempt() {
  editingAttemptKey = null;
  renderMocks();
}
function saveEditedAttempt(id, attemptNum) {
  const mocks = load(STORE_KEYS.MOCKS, []);
  const m = mocks.find(x => x.id === id);
  if (!m) return;
  const a = (m.attempts || []).find(x => x.attemptNum === attemptNum);
  if (!a) return;
  const mockName = document.getElementById('edit-mockname-' + id + '-' + attemptNum).value.trim();

  const verbal= document.getElementById('edit-verbal-'+ id + '-' + attemptNum).value;
  const di    = document.getElementById('edit-di-'    + id + '-' + attemptNum).value;
  const notes = document.getElementById('edit-notes-' + id + '-' + attemptNum).value;

  m.mockName = mockName;
  delete a.mockName; // clear any stale per-attempt copy from before this moved up
  a.date = date;
