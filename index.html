// Dynamic mastery donut chart for the Topics tab — shows the Mastered / In
// progress / Not started split as a ring with the overall % in the center,
// plus a text legend below it (so the breakdown is visible without
// interaction) and a hover/tap tooltip per segment (reusing the same
// tooltip plumbing as the Score Trend sparkline) for the exact counts.
function buildMasteryDonutHTML(topicsByStatus, totalAll) {
  const masteredAll   = topicsByStatus.mastered.length;
  const inProgAll      = topicsByStatus.in_progress.length;
  const notStartedAll = topicsByStatus.not_started.length;
  const size = 120, r = 46, strokeW = 16;
  const circumference = 2 * Math.PI * r;
  const segments = [
    { key: 'mastered', label: 'Mastered', color: 'var(--success)', value: masteredAll },
    { key: 'in_progress', label: 'In progress', color: 'var(--warning)', value: inProgAll },
    { key: 'not_started', label: 'Not started', color: 'var(--border)', value: notStartedAll }
  ].filter(s => s.value > 0);

  // The wheel and legend are clickable — tapping either opens a full-list
  // panel with every topic name for that status (see openTopicListModal),
  // so the person can check exactly which topics are mastered/in
  // progress/not started without a cramped scrolling tooltip. Hover just
  // gives a quick count/percentage, kept short on purpose.
  window.__donutFullLists = topicsByStatus;
  window.__donutTotalAll = totalAll;
  window.__donutTips = segments.map(s => {
    const pct = totalAll ? Math.round((s.value / totalAll) * 100) : 0;
    return `<div style="font-weight:800">${escapeHtml(s.label)}</div><div style="font-size:10.5px;color:var(--muted);margin-top:1px">${s.value} topic${s.value === 1 ? '' : 's'} · ${pct}%</div><div style="font-size:9.5px;color:var(--muted);margin-top:4px">Tap to see the full list</div>`;
  });

  let offsetAcc = 0;
  const segsHTML = segments.map((s, i) => {
    const frac = totalAll ? s.value / totalAll : 0;
    const arcLen = frac * circumference;
    const dashOffset = -offsetAcc;
    offsetAcc += arcLen;
    const handlers = `onmouseenter="showSparkTooltip(event, window.__donutTips[${i}])" onmousemove="positionSparkTooltip(event)" onmouseleave="hideSparkTooltip()" onclick="event.stopPropagation(); hideSparkTooltip(); openTopicListModal('${s.key}')"`;
    return `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${strokeW}" stroke-dasharray="${arcLen} ${circumference - arcLen}" stroke-dashoffset="${dashOffset}" style="cursor:pointer" ${handlers}></circle>`;
  }).join('');

  const overallPct = totalAll ? Math.round((masteredAll / totalAll) * 100) : 0;

  const legendRow = (key, color, label, count) =>
    `<div style="cursor:pointer" onclick="openTopicListModal('${key}')"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${color};margin-right:7px"></span>${label} — ${count}/${totalAll}</div>`;

  return `
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">
        <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg)">
          <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--card-2)" stroke-width="${strokeW}"></circle>
          ${segsHTML}
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">
          <div style="font-size:20px;font-weight:800;color:var(--text)">${overallPct}%</div>
          <div style="font-size:8.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase">Mastered</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--text);min-width:150px">
        ${legendRow('mastered', 'var(--success)', 'Mastered', masteredAll)}
        ${legendRow('in_progress', 'var(--warning)', 'In progress', inProgAll)}
        ${legendRow('not_started', 'var(--border)', 'Not started', notStartedAll)}
        <div style="font-size:9.5px;color:var(--muted);margin-top:2px">Tap the ring or a row for the full list</div>
      </div>
    </div>
  `;
}

// Full-list panel for a mastery-status bucket — opened by tapping the donut
// ring or a legend row. Shows every topic name with no cap and no nested
// scrollbar-in-a-tooltip; it's a proper bottom-sheet/modal instead, so long
// lists (e.g. 40+ "Not started" topics) are easy to read.
function closeTopicListModal() {
  const el = document.getElementById('topic-list-modal-overlay');
  if (el && el.remove) el.remove();
}
function openTopicListModal(statusKey) {
  closeTopicListModal();
  const meta = {
    mastered: { label: 'Mastered', color: 'var(--success)' },
    in_progress: { label: 'In progress', color: 'var(--warning)' },
    not_started: { label: 'Not started', color: 'var(--border)' }
  }[statusKey] || { label: '', color: 'var(--text)' };
  const names = (window.__donutFullLists && window.__donutFullLists[statusKey]) || [];
  const totalAll = window.__donutTotalAll || 0;
  const pct = totalAll ? Math.round((names.length / totalAll) * 100) : 0;
  const itemsHTML = names.length
    ? names.map(n => `<li>${escapeHtml(n)}</li>`).join('')
    : `<div style="color:var(--muted);font-size:12px;padding:6px 0 2px">No topics here yet.</div>`;

  if (!document.body || !document.createElement) return;
  const overlay = document.createElement('div');
  overlay.id = 'topic-list-modal-overlay';
  overlay.className = 'topic-modal-overlay';
  overlay.innerHTML = `
    <div class="topic-modal">
      <div class="topic-modal-head">
        <div>
          <div class="topic-modal-title" style="color:${meta.color}">${escapeHtml(meta.label)}</div>
          <div class="topic-modal-sub">${names.length} topic${names.length === 1 ? '' : 's'} · ${pct}%</div>
        </div>
        <button type="button" class="topic-modal-close" onclick="closeTopicListModal()">✕</button>
      </div>
      <ul class="topic-modal-list">${itemsHTML}</ul>
    </div>
  `;
  if (overlay.addEventListener) {
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeTopicListModal();
    });
  }
  document.body.appendChild(overlay);
}

// Which topic-group headers are expanded, persisted across re-renders
// (cycling a chip re-renders the whole tab, so this can't just live in the
// DOM's <details open> state — same reasoning as openMockCards elsewhere).
// null = not yet initialized for this session.
let openTopicGroups = null;
function toggleTopicGroupOpen(name, isOpen) {
  if (!openTopicGroups) openTopicGroups = new Set();
  if (isOpen) openTopicGroups.add(name);
  else openTopicGroups.delete(name);
}

function renderTopics() {
  const root = document.getElementById('view-topics');
  const state = load(STORE_KEYS.TOPICS, {});

  let groupsHTML = '';
  let totalAll = 0, masteredAll = 0, inProgAll = 0;
  const topicsByStatus = { mastered: [], in_progress: [], not_started: [] };
  for (const g of TOPIC_GROUPS) {
    let mastered = 0, inProg = 0;
    let chips = '';
    for (const t of g.topics) {
      const key = g.name + '::' + t;
      const st = state[key] || 'not_started';
      if (st === 'mastered') mastered++;
      if (st === 'in_progress') inProg++;
      const bucket = topicsByStatus[st] || topicsByStatus.not_started;
      bucket.push(g.name + ': ' + t);
      chips += `<span class="chip ${st}" onclick="cycleTopic('${escapeJsAttr(key)}')">${escapeHtml(t)}</span>`;
    }
    totalAll += g.topics.length;
    masteredAll += mastered;
    inProgAll += inProg;
    const pct = Math.round((mastered / g.topics.length) * 100);

    // Default a group open the first time it's seen if it already has some
    // progress logged; collapsed otherwise. After that, the person's own
    // manual expand/collapse (tracked in openTopicGroups) always wins.
    if (openTopicGroups === null) openTopicGroups = new Set();
    if (!openTopicGroups.has('__seen:' + g.name)) {
      openTopicGroups.add('__seen:' + g.name);
      if (mastered > 0 || inProg > 0) openTopicGroups.add(g.name);
    }
    const isOpen = openTopicGroups.has(g.name);

    groupsHTML += `
      <details class="topic-group"${isOpen ? ' open' : ''} ontoggle="toggleTopicGroupOpen('${escapeJsAttr(g.name)}', this.open)">
        <summary class="ghead">
          <div class="gname">${escapeHtml(g.name)}</div>
          <div class="gstats">${mastered}/${g.topics.length} mastered · ${inProg} in progress</div>
        </summary>
        <div class="gbar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="chips">${chips}</div>
      </details>
    `;
  }

  const donutHTML = buildMasteryDonutHTML(topicsByStatus, totalAll);

  root.innerHTML = `
    <div class="top-strip">
      <div class="brand"><b>TOPICS</b></div>
      <div class="exam-cd">${daysUntilExam()}d to exam</div>
    </div>
    <div class="sparkline-card">
      ${donutHTML}
    </div>
    <div class="cal-legend" style="margin-bottom:18px">
      <span class="lg-item"><span class="sw" style="background:var(--card-2);border:1px solid var(--border)"></span>Not started</span>
      <span class="lg-item"><span class="sw" style="background:rgba(255,187,51,.4)"></span>In progress</span>
      <span class="lg-item"><span class="sw" style="background:var(--success)"></span>Mastered</span>
      <span style="margin-left:auto;color:var(--muted);font-size:10px">Tap a chip to cycle</span>
    </div>
    ${groupsHTML}
  `;
}

function escapeJsAttr(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function cycleTopic(key) {
  const state = load(STORE_KEYS.TOPICS, {});
  const cur = state[key] || 'not_started';
  const next = cur === 'not_started' ? 'in_progress' : (cur === 'in_progress' ? 'mastered' : 'not_started');
  state[key] = next;
  save(STORE_KEYS.TOPICS, state);
  renderTopics();
}

// Builds the inline day-schedule editor: tag chips + topic checkboxes (pulled
// live from TOPIC_GROUPS, the same list the Topics tab uses) + a notes field.
// Tag/topic selections mutate dayEditDraft directly via onclick/onchange (no
// re-render), so the notes textarea never loses focus or unsent text mid-edit.
// Options for the per-topic tag dropdown. Empty value = no tag assigned.
// Simple 2-step flow: (1) pick the type you're tagging as, (2) tick the
// topics you did — they get stamped with whichever type is active. Switch
// the active type and tick more topics to mix types on the same day.
// Replaces the old per-topic dropdown, which meant scanning a dropdown for
// every single topic even when only 1-2 were actually worked on.
function renderDayEditorHTML(dateStr) {
  const draft = dayEditDraft || { topicTags: {}, generalTags: new Set(), activeTag: 'CONCEPT' };
  if (!draft.activeTag) draft.activeTag = 'CONCEPT';

  const activeChipsHTML = DAY_TAGS.map(tag => {
    const sel = draft.activeTag === tag;
    return `<span class="badge-type ${tag}${sel ? ' selected' : ''}" style="cursor:pointer;margin:0 6px 6px 0;display:inline-block" onclick="setActiveTag(this,'${tag}')">${tag}</span>`;
  }).join('');

  const topicGroupsHTML = TOPIC_GROUPS.map((g, gi) => {
    const groupHasTags = g.topics.some(t => draft.topicTags[g.name + '::' + t]);
    const itemsHTML = g.topics.map((t, ti) => {
      const key = g.name + '::' + t;
      const currentTag = draft.topicTags[key] || '';
      const badgeId = `topic-badge-${gi}-${ti}`;
      return `<label style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12.5px;color:var(--text)">
                <input type="checkbox" data-topic-key="${escapeJsAttr(key)}" data-badge-id="${badgeId}" ${currentTag ? 'checked' : ''} onchange="toggleTopicCheckbox(this)">
                <span style="flex:1">${escapeHtml(t)}</span>
                <span id="${badgeId}" class="topic-tag-badge" style="${currentTag ? '' : 'display:none;'}background:${currentTag ? tagColorVar(currentTag) : 'transparent'}">${currentTag}</span>
              </label>`;
    }).join('');
    return `<details${groupHasTags ? ' open' : ''} style="margin-bottom:6px">
              <summary style="cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:4px 0">${escapeHtml(g.name)}</summary>
              <div style="padding-left:2px">${itemsHTML}</div>
            </details>`;
  }).join('');

  // Whole-day tags — for days with no specific topic to tag (a full Rest day,
  // an unplanned mock, etc). Kept separate from per-topic tags above.
  const generalChipsHTML = DAY_TAGS.map(tag => {
    const sel = draft.generalTags.has(tag);
    return `<span class="badge-type ${tag}${sel ? ' selected' : ''}" style="cursor:pointer;margin:0 6px 6px 0;display:inline-block" onclick="toggleDraftGeneralTag(this,'${tag}')">${tag}</span>`;
  }).join('');

  const overrides = load(STORE_KEYS.DAY_OVERRIDES, {});
  const existingNotes = (overrides[dateStr] && overrides[dateStr].notes) || '';

  return `
    <div class="day-editor">
      <div class="section-title" style="margin-bottom:6px">Whole-day tag — tap directly, no topics needed (e.g. a Mock exam day, a Rest day)</div>
      <div>${generalChipsHTML}</div>

      <div class="section-title" style="margin:16px 0 2px;padding-top:14px;border-top:1px solid var(--border)">Or, tag specific topics you covered</div>
      <div class="section-title" style="margin-bottom:6px;font-size:10px">1. Tagging as</div>
      <div>${activeChipsHTML}</div>
      <div class="section-title" style="margin:14px 0 6px;font-size:10px">2. Tick the topics you covered</div>
      <div style="max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--card-2)">
        ${topicGroupsHTML}
      </div>

      <div class="section-title" style="margin:14px 0 6px">Notes / remarks</div>
      <textarea id="day-editor-notes" placeholder="Anything you want to remember about this day...">${escapeHtml(existingNotes)}</textarea>
      <div class="actions" style="margin-top:12px">
        <button class="btn primary" onclick="saveDayOverride('${dateStr}')">Save</button>
        <button class="btn muted" onclick="cancelEditDay()">Cancel</button>
      </div>
    </div>
  `;
}

// =====================================================================
// CALENDAR VIEW
// =====================================================================
let selectedCalDate = null;
let editingDayDate = null;   // date currently being edited in the day-schedule editor, or null
let dayEditDraft = null;     // { topicTags: {key: TAG}, generalTags: Set, activeTag: TAG } — in-progress edits before Save

const DAY_TAGS = ['CONCEPT', 'DRILL', 'REVIEW', 'MOCK', 'REST'];

function renderCalendar() {
  const root = document.getElementById('view-calendar');
  if (!calendarMonth) {
    const now = new Date();
    const planStart = fromYMD(PLAN.weeks[0].startDate);
    const planEnd   = fromYMD(EXAM_DATE);
    if (now < planStart)     calendarMonth = new Date(planStart.getFullYear(), planStart.getMonth(), 1);
    else if (now > planEnd)  calendarMonth = new Date(planEnd.getFullYear(),   planEnd.getMonth(),   1);
    else                     calendarMonth = new Date(now.getFullYear(),        now.getMonth(),        1);
  }

  const state     = getState();
  const monthName = fmtMonthName(calendarMonth, false) + ' ' + calendarMonth.getFullYear();
  const planStart = fromYMD(PLAN.weeks[0].startDate);
  const planEnd   = fromYMD(EXAM_DATE);
  const earliest  = new Date(2024, 0, 1);  // widened: mocks/day-overrides can be logged on any date, not just within the plan window
  const latest    = new Date(2029, 0, 1);
  const canPrev   = calendarMonth > earliest;
  const canNext   = calendarMonth < latest;

  // ── Build mock lookup: dateISO → { ids[], anyChecked } ──────────────
  const mockByDate = buildMockByDate(state.mocks);
  const nextMockPlan = load(STORE_KEYS.NEXT_MOCK, null);

  // ── Calendar grid ───────────────────────────────────────────────────
  const year        = calendarMonth.getFullYear();
  const month       = calendarMonth.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const leadOffset  = (new Date(year, month, 1).getDay() + 6) % 7; // Mon-first

  let gridHTML = `<div class="cal-grid">
    <div class="cal-wd">MON</div><div class="cal-wd">TUE</div><div class="cal-wd">WED</div>
    <div class="cal-wd">THU</div><div class="cal-wd">FRI</div><div class="cal-wd">SAT</div>
    <div class="cal-wd">SUN</div>`;

  for (let i = 0; i < leadOffset; i++) gridHTML += `<div class="cal-cell empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj  = new Date(year, month, d);
    const dateStr  = ymd(dateObj);
    const inRange  = (dateObj >= planStart && dateObj <= planEnd);
    const mockInfo = mockByDate[dateStr];
    const override = normalizeOverride(state.dayOverrides[dateStr]);
    const isToday  = (dateStr === todayYMD());
    const isSelected = (selectedCalDate === dateStr);

    // CSS classes — identical logic to original
    let cls = 'cal-cell';
    if (!inRange)               cls += ' outside';
    if (isToday)                cls += ' today';
    if (isSelected)             cls += ' selected';

    // Dots — one per distinct tag actually used that day (from the whole-day
    // tags plus every individually-tagged topic), plus a mock dot for a
    // logged attempt (solid) or the Next Mock widget's scheduled date
    // (dimmed — "due" rather than "done"). Only reflects what's actually
    // been logged/scheduled; the original plan never influences this — an
    // unedited day simply shows no dots.
    const distinctTags = new Set();
    if (override) {
      (override.generalTags || []).forEach(t => distinctTags.add(t));
      Object.values(override.topicTags || {}).forEach(t => distinctTags.add(t));
    }
    let dotsHTML = Array.from(distinctTags).slice(0, 4).map(t =>
      `<span class="tdot-mini" style="background:${tagColorVar(t)}"></span>`
    ).join('');
    if (mockInfo) {
      dotsHTML += `<span class="tdot-mini" style="background:var(--c-mock)"></span>`;
    } else if (nextMockPlan && nextMockPlan.date === dateStr && !distinctTags.has('MOCK')) {
      dotsHTML += `<span class="tdot-mini" style="background:var(--c-mock);opacity:0.45"></span>`;
    }
    if (!dotsHTML) {
      dotsHTML = `<span class="tdot-mini" style="background:transparent"></span>`;
    }

    // Every day is clickable now — you can view/add a schedule or log a mock on any date,
    // not just within the original plan window.
    const clickHandler  = `onclick="selectCalDate('${dateStr}')"`;
    const mockBadge     = (mockInfo && mockInfo.ids.length > 1)
                            ? `<span style="position:absolute;top:2px;right:2px;background:var(--c-mock);color:#fff;font-size:8px;font-weight:900;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center">${mockInfo.ids.length}</span>`
                            : '';

    gridHTML += `
      <div class="${cls}" ${clickHandler}>
        <span class="dnum">${d}</span>
        <span class="tdot-row">${dotsHTML}</span>
        ${mockBadge}
      </div>`;
  }
  gridHTML += '</div>';

  // ── Detail panel ─────────────────────────────────────────────────────
  let detailHTML = '';
  if (selectedCalDate) {
    const mockInfo = mockByDate[selectedCalDate];
    const dateObj  = fromYMD(selectedCalDate);
    const dateLbl  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dateObj.getDay()]
                     + ', ' + fmtMonthName(dateObj, false) + ' ' + dateObj.getDate();

    // Helper: week number for any date (kept purely as navigational context —
    // not treated as "plan content", so it's fine to keep showing it)
    const wNum = (() => {
      for (const w of PLAN.weeks) {
        if (selectedCalDate >= w.startDate && selectedCalDate <= w.endDate) return w.weekNum;
      }
      return null;
    })();

    const overrides = load(STORE_KEYS.DAY_OVERRIDES, {});
    const override = overrides[selectedCalDate];

    if (editingDayDate === 'clear:' + selectedCalDate) {
      // ── Confirm removing a custom day schedule ──
      detailHTML = `
        <div class="cal-detail">
          <div class="head">
            <div>
              <div class="date-lbl">${dateLbl}</div>
              <div class="meta-line">Remove your custom schedule for this day?</div>
            </div>
            <button class="close-btn" onclick="closeCalDetail()">✕</button>
          </div>
          <div class="actions">
            <button class="btn" style="background:var(--danger,#FF5252);color:#fff" onclick="clearDayOverride('${selectedCalDate}')">Yes, remove</button>
            <button class="btn muted" onclick="cancelClearDayOverride()">Cancel</button>
          </div>
        </div>`;

    } else if (editingDayDate === selectedCalDate) {
      // ── Editing this day's schedule ──
      detailHTML = `
        <div class="cal-detail">
          <div class="head">
            <div>
              <div class="date-lbl">${dateLbl}</div>
              <div class="meta-line">${wNum ? `Week ${wNum}` : 'Edit schedule'}</div>
            </div>
            <button class="close-btn" onclick="closeCalDetail()">✕</button>
          </div>
          ${renderDayEditorHTML(selectedCalDate)}
        </div>`;

    } else {
      // ── Read-only view — shows ONLY what's been logged (tags/topics/notes/mock), nothing prewritten ──
      detailHTML = `
        <div class="cal-detail">
          <div class="head">
            <div>
              <div class="date-lbl">${dateLbl}</div>
              <div class="meta-line">${wNum ? `Week ${wNum}` : ''}</div>
            </div>
            <button class="close-btn" onclick="closeCalDetail()">✕</button>
          </div>
          ${renderDayContentHTML(selectedCalDate, mockInfo, state.mocks)}
          <div class="actions" style="margin-top:12px">
            <button class="btn primary" onclick="startEditDay('${selectedCalDate}')">${override ? 'Edit' : '+ Add schedule'}</button>
            ${override ? `<button class="btn muted small" onclick="requestClearDayOverride('${selectedCalDate}')">Remove</button>` : ''}
          </div>
        </div>`;
    }
  }

  // ── Assemble ─────────────────────────────────────────────────────────
  root.innerHTML = `
    <div class="top-strip">
      <div class="brand"><b>CALENDAR</b> · ${monthName}</div>
      <div class="exam-cd">${daysUntilExam()}d to exam</div>
    </div>
    <div class="cal-header">
      <button class="navbtn" onclick="changeMonth(-1)" ${canPrev ? '' : 'disabled'}>‹</button>
      <div class="month-title">${monthName}</div>
      <button class="navbtn" onclick="changeMonth(1)" ${canNext ? '' : 'disabled'}>›</button>
    </div>
    ${gridHTML}
    <div class="cal-legend">
      <span class="lg-item"><span class="sw" style="background:var(--c-concept)"></span>Concept</span>
      <span class="lg-item"><span class="sw" style="background:var(--c-drill)"></span>Drill</span>
      <span class="lg-item"><span class="sw" style="background:var(--c-review)"></span>Review</span>
      <span class="lg-item"><span class="sw" style="background:var(--c-mock);opacity:0.45"></span>Mock (due)</span>
      <span class="lg-item"><span class="sw" style="background:var(--c-mock)"></span>Mock (done)</span>
      <span class="lg-item"><span class="sw" style="background:var(--c-slip)"></span>Slip/Rest</span>
    </div>
    ${detailHTML}
  `;
}

function changeMonth(delta) {
  const m = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + delta, 1);
  const earliest = new Date(2024, 0, 1);
  const latest   = new Date(2029, 0, 1);
  if (m < earliest || m > latest) return;
  calendarMonth = m;
  selectedCalDate = null;
  renderCalendar();
}
function selectCalDate(dateStr) {
  selectedCalDate = (selectedCalDate === dateStr) ? null : dateStr;
  editingDayDate = null;
  dayEditDraft = null;
  renderCalendar();
}
function closeCalDetail() {
  selectedCalDate = null;
  editingDayDate = null;
  dayEditDraft = null;
  renderCalendar();
}
// Jumping to "Edit" from a Week-tab day card should land straight in the
// Calendar tab's day editor for that date — not just the read-only detail
// view, which would need a second tap on its own Edit button.
function editDayFromWeek(dateStr) {
  const d = fromYMD(dateStr);
  calendarMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  selectedCalDate = dateStr;
  showView('calendar');
  startEditDay(dateStr);
}

// ── Day schedule editor (Calendar tab) ────────────────────────────────
// Lets the person set their own tags (concept/drill/review/mock/rest),
// topics (pulled live from the Topics tab list), and notes for any date —
// overriding whatever the plan originally said for that day, or filling in
// a day the plan doesn't cover at all.
function startEditDay(dateStr) {
  const overrides = load(STORE_KEYS.DAY_OVERRIDES, {});
  const existing = normalizeOverride(overrides[dateStr]);
  dayEditDraft = {
    topicTags: Object.assign({}, existing ? existing.topicTags : {}),
    generalTags: new Set(existing ? existing.generalTags : []),
    activeTag: 'CONCEPT'
  };
  editingDayDate = dateStr;
  renderCalendar();
}
function cancelEditDay() {
  editingDayDate = null;
  dayEditDraft = null;
  renderCalendar();
}
function toggleDraftGeneralTag(el, tag) {
  if (!dayEditDraft) return;
  if (dayEditDraft.generalTags.has(tag)) dayEditDraft.generalTags.delete(tag);
  else dayEditDraft.generalTags.add(tag);
  if (el) el.classList.toggle('selected');
}
// Called from a "Tagging as" chip. Sets which type gets stamped onto the
// next topics ticked below. Updates the chip row in place — no full
// re-render — so in-progress notes text isn't disturbed.
function setActiveTag(el, tag) {
  if (!dayEditDraft) return;
  dayEditDraft.activeTag = tag;
  if (el && el.parentElement && el.parentElement.children) {
    Array.from(el.parentElement.children).forEach(c => {
      if (c.classList) c.classList.remove('selected');
    });
  }
  if (el && el.classList) el.classList.add('selected');
}
// Called from a topic checkbox onchange. Ticking a topic stamps it with the
// currently active tag; unticking clears its tag. Updates the draft and
// that row's little colored badge directly, without a full re-render.
function toggleTopicCheckbox(checkboxEl) {
  if (!dayEditDraft || !checkboxEl) return;
  const key = checkboxEl.getAttribute('data-topic-key');
  const badgeId = checkboxEl.getAttribute('data-badge-id');
  const badge = badgeId ? document.getElementById(badgeId) : null;
  if (checkboxEl.checked) {
    const tag = dayEditDraft.activeTag || 'CONCEPT';
    dayEditDraft.topicTags[key] = tag;
    if (badge) {
      badge.textContent = tag;
      badge.style.display = '';
      badge.style.background = tagColorVar(tag);
    }
  } else {
    delete dayEditDraft.topicTags[key];
    if (badge) {
      badge.textContent = '';
      badge.style.display = 'none';
    }
  }
}
function saveDayOverride(dateStr) {
  if (!dayEditDraft) return;
  const notesEl = document.getElementById('day-editor-notes');
  const notes = notesEl ? notesEl.value.trim() : '';
  const overrides = load(STORE_KEYS.DAY_OVERRIDES, {});
  overrides[dateStr] = {
    topicTags: Object.assign({}, dayEditDraft.topicTags),
    generalTags: Array.from(dayEditDraft.generalTags),
    notes
  };
  save(STORE_KEYS.DAY_OVERRIDES, overrides);
  editingDayDate = null;
  dayEditDraft = null;
  burstConfetti();
  renderCalendar();
}
function requestClearDayOverride(dateStr) {
  editingDayDate = 'clear:' + dateStr;
  renderCalendar();
}
function cancelClearDayOverride() {
  editingDayDate = null;
  renderCalendar();
}
function clearDayOverride(dateStr) {
  const overrides = load(STORE_KEYS.DAY_OVERRIDES, {});
  delete overrides[dateStr];
  save(STORE_KEYS.DAY_OVERRIDES, overrides);
  editingDayDate = null;
  dayEditDraft = null;
  renderCalendar();
}

// =====================================================================
// NAVIGATION
// =====================================================================
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('#nav .nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  const el = document.getElementById('view-' + name);
  if (el) el.classList.add('active');
  if (name === 'week') renderWeek();
  else if (name === 'mocks') renderMocks();
  else if (name === 'topics') renderTopics();
  else if (name === 'calendar') renderCalendar();
  window.scrollTo(0, 0);
}

// =====================================================================
// BOOT
// =====================================================================
renderWeek();
// Pre-render others so cross-tab updates are fast
renderMocks();
renderTopics();
renderCalendar();
showView('week');
</script>
</body>
</html>
